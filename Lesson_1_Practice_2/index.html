    <body>
        <script>
            const secret = Math.floor(Math.random() * 100) + 1;
            let number_by_user = Number(prompt("Guess a number: ");

            {
                console.log(number_by_user)
            }
            else
            {
                console.log("Correct!")
            }
            
        </script>
